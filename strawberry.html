<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>娃娃多輪配貨系統 (款式配套優化版)</title>

    <style>
        :root {
            --bg: #fff8f7;
            --surface: rgba(255, 255, 255, 0.94);
            --surface-soft: #fff2f2;
            --surface-warm: #fff8ee;
            --text: #3d3034;
            --muted: #88777c;
            --line: #eadfe2;
            --primary: #e8758d;
            --primary-dark: #cf5e77;
            --primary-soft: #ffe4e9;
            --strawberry-bg: #ffe1e7;
            --strawberry-text: #bd3f60;
            --original-bg: #f7ead8;
            --original-text: #8b5a2b;
            --danger-bg: #f1f0f2;
            --danger-text: #716a70;
            --shadow: 0 14px 40px rgba(119, 78, 88, 0.10);
            --shadow-hover: 0 18px 46px rgba(119, 78, 88, 0.15);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 11px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px 64px;
            color: var(--text);
            background:
                radial-gradient(circle at 8% 0%, rgba(255, 210, 219, 0.62), transparent 28%),
                radial-gradient(circle at 96% 12%, rgba(255, 230, 194, 0.48), transparent 25%),
                linear-gradient(180deg, #fffafa 0%, #fff7f5 45%, #fdf9f7 100%);
            font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
            line-height: 1.65;
        }

        button,
        input {
            font: inherit;
        }

        .container {
            width: min(1480px, 100%);
            margin: 0 auto;
        }

        .page-header {
            position: relative;
            overflow: hidden;
            margin-bottom: 24px;
            padding: 34px 38px;
            color: #fff;
            background:
                linear-gradient(135deg, rgba(230, 108, 135, 0.96), rgba(210, 123, 96, 0.92));
            border-radius: 28px;
            box-shadow: 0 18px 50px rgba(190, 89, 111, 0.22);
        }

        .page-header::before,
        .page-header::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.14);
            pointer-events: none;
        }

        .page-header::before {
            width: 190px;
            height: 190px;
            right: -42px;
            top: -74px;
        }

        .page-header::after {
            width: 92px;
            height: 92px;
            right: 140px;
            bottom: -46px;
        }

        .page-header h1 {
            position: relative;
            z-index: 1;
            margin: 0 0 8px;
            font-size: clamp(26px, 4vw, 42px);
            line-height: 1.25;
            letter-spacing: 0.02em;
        }

        .page-header p {
            position: relative;
            z-index: 1;
            max-width: 760px;
            margin: 0;
            color: rgba(255, 255, 255, 0.88);
            font-size: 15px;
        }

        .card {
            margin-bottom: 22px;
            padding: 26px;
            background: var(--surface);
            border: 1px solid rgba(234, 223, 226, 0.88);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        .card h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 8px;
            color: var(--text);
            font-size: clamp(19px, 2.3vw, 25px);
            line-height: 1.45;
        }

        .card h2::before {
            content: "";
            flex: 0 0 auto;
            width: 7px;
            height: 24px;
            background: linear-gradient(180deg, var(--primary), #e8ad75);
            border-radius: 999px;
        }

        .section-description {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 14px;
        }

        .stock-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            margin: 22px 0 24px;
        }

        .stock-item {
            position: relative;
            overflow: hidden;
            padding: 16px;
            background: linear-gradient(145deg, #fff, #fff7f6);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .stock-item::after {
            content: "🧸";
            position: absolute;
            right: 12px;
            top: 9px;
            opacity: 0.12;
            font-size: 32px;
            pointer-events: none;
        }

        .stock-item:hover {
            transform: translateY(-2px);
            border-color: #eab8c2;
            box-shadow: 0 10px 24px rgba(119, 78, 88, 0.08);
        }

        .stock-item label {
            display: block;
            margin-bottom: 12px;
            padding-bottom: 8px;
            color: #57464b;
            border-bottom: 1px dashed #dfcfd3;
            font-size: 19px;
            font-weight: 800;
        }

        .stock-inputs-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stock-labels,
        .stock-inputs {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
        }

        .stock-labels {
            padding: 0 2px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }

        .stock-labels span:first-child::before {
            content: "🍓 ";
        }

        .stock-labels span:last-child::before {
            content: "🤎 ";
        }

        .stock-inputs input {
            width: 100%;
            min-width: 0;
            padding: 11px 8px;
            color: var(--text);
            background: #fff;
            border: 1px solid #dfd2d5;
            border-radius: 10px;
            outline: none;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        .stock-inputs input:hover {
            border-color: #daa9b4;
        }

        .stock-inputs input:focus {
            border-color: var(--primary);
            background: #fffafb;
            box-shadow: 0 0 0 4px rgba(232, 117, 141, 0.14);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 12px 24px;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), #dc806e);
            border: 0;
            border-radius: 13px;
            box-shadow: 0 10px 22px rgba(216, 92, 119, 0.22);
            cursor: pointer;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.03em;
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }

        .btn::before {
            content: "✨";
            margin-right: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(216, 92, 119, 0.28);
            filter: saturate(1.08);
        }

        .btn:active {
            transform: translateY(0);
        }

        .remaining-stock {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .stock-summary-item {
            padding: 14px 16px;
            background: linear-gradient(145deg, #fff, var(--surface-warm));
            border: 1px solid #eadfce;
            border-radius: 14px;
            font-size: 14px;
        }

        .stock-summary-item strong {
            display: inline-flex;
            width: 29px;
            height: 29px;
            margin-right: 6px;
            align-items: center;
            justify-content: center;
            color: #fff;
            background: #725d63;
            border-radius: 9px;
        }

        .stock-strawberry {
            color: var(--strawberry-text);
            font-weight: 800;
        }

        .stock-original {
            color: var(--original-text);
            font-weight: 800;
        }

        .table-scroll {
            width: 100%;
            margin-top: 18px;
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
        }

        table {
            width: 100%;
            min-width: 1000px;
            border-collapse: separate;
            border-spacing: 0;
            background: #fff;
        }

        th,
        td {
            padding: 14px 16px;
            border-right: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            text-align: left;
            vertical-align: middle;
        }

        th:last-child,
        td:last-child {
            border-right: 0;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        thead th {
            position: sticky;
            top: 0;
            z-index: 2;
            color: #5b474d;
            background: #fff0f2;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }

        tbody tr {
            transition: background-color 0.18s ease;
        }

        tbody tr:nth-child(even) {
            background: #fffbfb;
        }

        tbody tr:hover {
            background: #fff4f5;
        }

        .order-cell {
            color: #9b7c83;
            text-align: center;
            font-weight: 800;
        }

        .customer-name {
            color: #b64f69;
            font-weight: 800;
            white-space: nowrap;
        }

        .demand-text {
            color: #6f6266;
            font-size: 14px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 30px;
            margin: 3px 4px 3px 0;
            padding: 5px 10px;
            border: 1px solid transparent;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .badge-strawberry {
            color: var(--strawberry-text);
            background: var(--strawberry-bg);
            border-color: #f5b9c7;
        }

        .badge-strawberry::before {
            content: "🍓";
            margin-right: 4px;
        }

        .badge-original {
            color: var(--original-text);
            background: var(--original-bg);
            border-color: #e6cfaa;
        }

        .badge-original::before {
            content: "🤎";
            margin-right: 4px;
        }

        .badge-none {
            color: var(--danger-text);
            background: var(--danger-bg);
            border-color: #dbd7db;
            text-decoration: none;
        }

        .badge-none::before {
            content: "缺";
            display: inline-flex;
            width: 20px;
            height: 20px;
            margin-right: 5px;
            align-items: center;
            justify-content: center;
            color: #fff;
            background: #948c92;
            border-radius: 50%;
            font-size: 10px;
        }

        #remainingStockCard {
            border-color: #ead8bc;
            background: linear-gradient(145deg, rgba(255,255,255,.96), rgba(255,249,238,.96));
        }

        @media (max-width: 1100px) {
            .stock-grid,
            .remaining-stock {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 700px) {
            body {
                padding: 14px 10px 40px;
            }

            .page-header {
                padding: 25px 20px;
                border-radius: 20px;
            }

            .card {
                padding: 18px 14px;
                border-radius: 18px;
            }

            .stock-grid,
            .remaining-stock {
                grid-template-columns: 1fr;
            }

            .btn {
                width: 100%;
            }

            th,
            td {
                padding: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    
        .stock-total-line {
            margin-top: 10px;
            padding-top: 8px;
            color: var(--muted);
            border-top: 1px dashed #dfcfd3;
            text-align: center;
            font-size: 13px;
        }

        .stock-total-line strong,
        #grandStockTotal {
            color: var(--primary-dark);
            font-size: 16px;
            font-weight: 900;
        }

    </style>

</head>

        <div class="stock-grid" id="stockInputContainer">

    <div class="card" id="remainingStockCard" style="display:none;">

</div>

function initStockUI() {
    const container = document.getElementById('stockInputContainer');
    container.innerHTML = '';

    members.forEach(member => {
        const stock = initialStock[member] || { 草莓: 0, 原皮: 0 };

        const div = document.createElement('div');
        div.className = 'stock-item';

        div.innerHTML = `
            <label>${member}</label>

            <div class="stock-inputs-wrapper">
                <div class="stock-labels">
                    <span>草莓</span>
                    <span>原皮</span>
                </div>

                <div class="stock-inputs">
                    <input
                        type="number"
                        id="stock_${member}_草莓"
                        min="0"
                        step="1"
                        value="${stock.草莓}"
                        oninput="updateMemberStockTotal('${member}')"
                    >

                    <input
                        type="number"
                        id="stock_${member}_原皮"
                        min="0"
                        step="1"
                        value="${stock.原皮}"
                        oninput="updateMemberStockTotal('${member}')"
                    >
                </div>

                <div class="stock-total-line">
                    合計：
                    <strong id="stock_total_${member}">
                        ${stock.草莓 + stock.原皮}
                    </strong>
                    隻
                </div>
            </div>
        `;

        container.appendChild(div);
    });

    updateGrandStockTotal();
}

function updateMemberStockTotal(member) {
    const strawberry =
        parseInt(document.getElementById(`stock_${member}_草莓`).value, 10) || 0;

    const original =
        parseInt(document.getElementById(`stock_${member}_原皮`).value, 10) || 0;

    document.getElementById(`stock_total_${member}`).textContent =
        strawberry + original;

    updateGrandStockTotal();
}

function updateGrandStockTotal() {
    const total = members.reduce((sum, member) => {
        const strawberry =
            parseInt(document.getElementById(`stock_${member}_草莓`)?.value, 10) || 0;

        const original =
            parseInt(document.getElementById(`stock_${member}_原皮`)?.value, 10) || 0;

        return sum + strawberry + original;
    }, 0);

    const totalElement = document.getElementById('grandStockTotal');

    if (totalElement) {
        totalElement.textContent = total;
    }
}

function startDistribution() {
    // 讀取當前庫存
    let stock = {};
    for (const m of members) {
        const strawberry = Number(
            document.getElementById(`stock_${m}_草莓`).value
        );

        const original = Number(
            document.getElementById(`stock_${m}_原皮`).value
        );

        if (
            !Number.isInteger(strawberry) ||
            !Number.isInteger(original) ||
            strawberry < 0 ||
            original < 0
        ) {
            alert(`${m}的草莓與原皮庫存必須是 0 以上的整數`);
            return;
        }

        stock[m] = {
            草莓: strawberry,
            原皮: original
        };
    }

    let results = {};
    let currentDemands = {};
    // 用來紀錄每個客人，在「特定成員」上「已經拿過哪些款式」
    let historyOfAllocatedStyles = {}; 
    
    customersData.forEach(c => {
        results[c.id] = [];
        currentDemands[c.id] = { ...c.demands };
        historyOfAllocatedStyles[c.id] = {};
        members.forEach(m => {
            historyOfAllocatedStyles[c.id][m] = [];
        });
    });

    const maxRounds = 5; // 應對買3個的情況最多跑5輪
    
    for (let round = 1; round <= maxRounds; round++) {
        let anyDistributionInThisRound = false;

        customersData.forEach(customer => {
            const cId = customer.id;
            
            members.forEach(m => {
                // 如果這個客人在這個成員還有購買需求
                if (currentDemands[cId][m] && currentDemands[cId][m] > 0) {
                    const prefOrder = customer.prefs[m] || ['草莓', '原皮'];
                    let allocatedStyle = null;

                    // --- 套組優先核心邏輯 ---
                    // 第一步嘗試：找「他完全沒拿過」的款式，並配合偏好排序
                    for (let style of prefOrder) {
                        if (!historyOfAllocatedStyles[cId][m].includes(style) && stock[m][style] > 0) {
                            allocatedStyle = style;
                            break;
                        }
                    }

                    // 第二步保底：如果想配套的另一款沒庫存了，才准許拿「重複」的款式
                    if (!allocatedStyle) {
                        for (let style of prefOrder) {
                            if (stock[m][style] > 0) {
                                allocatedStyle = style;
                                break;
                            }
                        }
                    }

                    // 執行分發扣庫存
                    if (allocatedStyle) {
                        stock[m][allocatedStyle]--;
                        results[cId].push({ member: m, style: allocatedStyle, status: '成功' });
                        historyOfAllocatedStyles[cId][m].push(allocatedStyle); // 記錄已取得
                    } else {
                        results[cId].push({ member: m, style: '均無庫存', status: '斷貨' });
                    }

                    currentDemands[cId][m]--;
                    anyDistributionInThisRound = true;
                }
            });
        });

        if (!anyDistributionInThisRound) break;
    }

    renderResults(results, stock);
}

function renderResults(results, remainingStock) {
    document.getElementById('remainingStockCard').style.display = 'block';
    const stockContainer = document.getElementById('remainingStockContainer');
    stockContainer.innerHTML = '';
    members.forEach(m => {
        stockContainer.innerHTML += `
            <div class="stock-summary-item">
                <strong>${m}</strong>
                草莓剩 <span class="stock-strawberry">${remainingStock[m]['草莓']}</span>
                ・原皮剩 <span class="stock-original">${remainingStock[m]['原皮']}</span>
            </div>
        `;
    });

    const tbody = document.getElementById('resultTableBody');
    tbody.innerHTML = '';

    customersData.forEach(c => {
        const tr = document.createElement('tr');
        
        let demandStr = [];
        for (let m in c.demands) {
            const prefTxt = c.prefs[m].join('>');
            demandStr.push(`${m} x ${c.demands[m]} (${prefTxt})`);
        }

        let resultBadges = [];
        const myResults = results[c.id];
        
        if (myResults.length === 0) {
            resultBadges.push(`<span class="badge badge-none">無購買需求</span>`);
        } else {
            myResults.forEach(res => {
                if (res.status === '斷貨') {
                    resultBadges.push(`<span class="badge badge-none">${res.member}(缺貨)</span>`);
                } else {
                    const bgClass = res.style === '草莓' ? 'badge-strawberry' : 'badge-original';
                    resultBadges.push(`<span class="badge ${bgClass}">${res.member}(${res.style})</span>`);
                }
            });
        }

        tr.innerHTML = `
            <td class="order-cell">${c.id}</td>
            <td class="customer-name">${c.name}</td>
            <td class="demand-text">${demandStr.join('、')}</td>
            <td>${resultBadges.join(' ')}</td>
        `;
        tbody.appendChild(tr);
    });
}

window.onload = initStockUI;
</script>
